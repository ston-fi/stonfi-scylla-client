name: Build and test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: rustup toolchain install nightly --component rustfmt
      - run: cargo test --lib --locked
      - run: cargo test --doc --locked
      - run: cargo test --examples --locked
      - run: cargo +nightly fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings -D missing_docs" cargo doc --no-deps --all-features --locked
      - run: cargo package --list --locked

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
      - run: docker info
      - run: cargo test --test test_client --locked -- --test-threads=1

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: cargo check --all-features --locked

  release:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [quality, integration, msrv]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: Swatinem/rust-cache@v2
      - uses: dtolnay/rust-toolchain@stable
      - uses: release-plz/action@v0.5
        with:
          version: "0.3.160"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
